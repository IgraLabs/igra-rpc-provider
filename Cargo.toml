[package]
name = "igra-rpc-provider"
version = "0.1.0"
edition = "2021"
default-run = "igra-rpc-provider"
description = "RPC provider for Igra Network"
repository = "https://github.com/IgraLabs/igra-rpc-provider"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.3", features = ["macros"] }
borsh = "1.5.7"
bytes = "1.10.1"
chrono = "0.4.35"
clap = { version = "4.5.35", features = ["derive"] }
config = "0.15.11"
ethers = "2.0.14"
flate2 = "1.1.0"
hex = "0.4"
kaspa-addresses = { git = "https://github.com/IgraLabs/rusty-kaspa.git", branch = "for-wallet" }
kaspa-bip32 = { git = "https://github.com/IgraLabs/rusty-kaspa.git", branch = "for-wallet" }
kaspa-consensus-core = { git = "https://github.com/IgraLabs/rusty-kaspa.git", branch = "for-wallet" }
kaspa-hashes = { git = "https://github.com/IgraLabs/rusty-kaspa.git", branch = "for-wallet" }
kaspa-wallet-core = { git = "https://github.com/IgraLabs/rusty-kaspa.git", branch = "for-wallet" }
kaswallet-proto = { git="https://github.com/IgraLabs/kaswallet-proto.git", branch = "main" }
once_cell = "1.19"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
shlex = "1.1"
thiserror = "2.0.11"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tower = "0.4"
tower-http = { version = "0.5.2", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.12.3"
uuid = { version = "1.8.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"
tracing-test = "0.2"

[lints.rust]
missing_docs = "allow"
unsafe_code = "forbid"

[lints.clippy]
arithmetic_side_effects = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
needless_return = "deny"
panicking_overflow_checks = "deny"
unwrap_used = "deny"

[[bin]]
name = "kaspa_wallet_simulator"
path = "src/utils/simulators/wallet/kaspa_wallet_simulator.rs"

[[bin]]
name = "entry_transaction_sender"
path = "src/bin/entry_transaction_sender.rs"
