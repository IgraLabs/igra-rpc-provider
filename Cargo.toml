[package]
name = "igra-rpc-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.1", features = ["macros"] }
bytes = "1.10.1"
chrono = "0.4.35"
clap = { version = "4.5.30", features = ["derive"] }
config = "0.15.8"
ethers = "2.0"
flate2 = "1.1.0"
hex = "0.4"
kaswallet-proto = { git="https://github.com/IgraLabs/kaswallet-proto.git" }
once_cell = "1.19"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
shlex = "1.1"
thiserror = "2.0.11"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tower = "0.4"
tower-http = { version = "0.5.2", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.12.3"
uuid = { version = "1.8.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"

[[bin]]
name = "kaspa_wallet_simulator"
path = "src/utils/simulators/wallet/kaspa_wallet_simulator.rs"