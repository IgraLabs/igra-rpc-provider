[package]
name = "igra-rpc-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
clap = { version = "4.5.30", features = ["derive"] }
config = "0.15.8"
ethers = "2.0"
hex = "0.4"
once_cell = "1.19"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
shlex = "1.1"
thiserror = "2.0.11"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.12.3"
kaswallet-proto = { path = "../kaswallet/kaswallet_proto" }
bytes = "1.10.1"

[dev-dependencies]
mockito = "1.2"
tokio-test = "0.4"

[[bin]]
name = "kaspa_wallet_simulator"
path = "src/utils/simulators/wallet/kaspa_wallet_simulator.rs"