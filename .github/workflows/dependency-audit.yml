name: Dependency security audit

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true


jobs:
  security_audit:
    timeout-minutes: 10
    runs-on: [self-hosted, igra-rpc-provider]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust environment
        run: |
          source ~/.cargo/env
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV
          echo "Using rustc: $(rustc +stable --version)"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target-security_audit
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-audit-

      - name: Run security audit
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-${GITHUB_JOB}"
          cargo +stable deny check
