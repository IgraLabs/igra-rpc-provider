name: UB (undefined behavior) detection

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-backtrace=full"
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  ub_detection:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Check for undefined behaviour (UB) with Miri
    timeout-minutes: 30
    runs-on: [self-hosted, igra-rpc-provider]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust nightly environment
        run: |
          source ~/.cargo/env
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV

          # Verify nightly toolchain and miri are available
          rustup toolchain install nightly
          rustup component add miri --toolchain nightly
          echo "Using rustc: $(rustc +nightly --version)"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target-ub_detection
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-miri-

      - name: Run Miri tests
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-miri-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          rm -rf "${CARGO_TARGET_DIR}"
          cargo +nightly miri test --all-features
