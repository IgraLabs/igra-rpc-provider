name: Format, Lint & Typos

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  format-lint-typos:
    runs-on: [self-hosted, igra-rpc-provider]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust environment
        run: |
          source ~/.cargo/env
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV
          # Install the toolchain specified in rust-toolchain.toml
          rustup show
          echo "Using rustc: $(rustc --version)"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target-format-lint-typos
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-lint-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target-${GITHUB_JOB}"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run typos
        run: typos